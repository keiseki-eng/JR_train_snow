# ==========================================
# 気象データ
# ==========================================
WEATHER_FEATURE:
  locations:
    - 富山
    - 糸魚川
    - 金沢

  variables:
    - 気温
    - 降水量
    - 降雪
    - 積雪
    - 日照時間_時間_
    - 風速_m_s_
    - 風向
    - 日射量_MJ_m2_
    - 現地気圧_hPa_
    - 海面気圧_hPa_
    - 相対湿度_%_
    - 蒸気圧_hPa_
    - 雲量_10分比_
    - 露点温度_℃_

