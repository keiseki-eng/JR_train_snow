# ==========================================
# 積雪計データ
# ==========================================
SNOW_FEATURE:
  locations:
    - 富山野々上
    # 実際の「地域名」の値に合わせて追加
    # - ○○
    # - ○○

  variables:
    - 積雪深_軌道_
    - 積雪深_側溝_
    - 積雪深_軌道A_
    - 積雪深_軌道B_

  statistics:
    - mean
    - max
    - min

  time_zones:
    - "0-6"
    - "6-12"
    - "12-18"
    - "18-24"


# 積雪計のカテゴリカル変数
SNOW_CATEGORY:
  "SNOW_CATEGORY_LIST":
    []


# ==========================================
# LightGBM のパラメータ設定
# ==========================================
MODEL_PARAMS:
  "objective": "regression"
  "metric": "rmse"
  "alpha": 0.8
  "boosting_type": "gbdt"
  "min_data_in_leaf": 50
  "learning_rate": 0.05
  "num_leaves": 64
  "max_depth": -1
  "feature_fraction": 0.8
  "bagging_fraction": 0.8
  "bagging_freq": 1
  "verbosity": -1